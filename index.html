<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de gastos personales</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Control de gastos personales</h1>

    <form id="form-gasto" novalidate>
  <div class="campo">
    <label for="descripcion">Descripción</label>
    <input type="text" id="descripcion" placeholder="Ej: Almuerzo">
    <p class="error" id="error-descripcion"></p>
  </div>

  <div class="campo">
    <label for="valor">Valor (COP)</label>
    <input type="number" id="valor" placeholder="Ej: 15000">
    <p class="error" id="error-valor"></p>
  </div>

  <div class="campo">
    <label for="categoria">Categoría</label>
    <select id="categoria">
      <option value="">Selecciona...</option>
      <option value="Comida">Comida</option>
      <option value="Transporte">Transporte</option>
      <option value="Estudio">Estudio</option>
      <option value="Otros">Otros</option>
    </select>
    <p class="error" id="error-categoria"></p>
  </div>

  <button type="submit">Agregar gasto</button>
</form>
<div class="filtro">
  <label for="filtro">Filtrar por categoría</label>
  <select id="filtro">
    <option value="Todas">Todas</option>
    <option value="Comida">Comida</option>
    <option value="Transporte">Transporte</option>
    <option value="Estudio">Estudio</option>
    <option value="Otros">Otros</option>
  </select>
</div>

<table>
  <thead>
    <tr>
      <th>Descripción</th>
      <th>Categoría</th>
      <th>Valor</th>
      <th>Acción</th>
    </tr>
  </thead>
  <tbody id="tabla-gastos"></tbody>
</table>

<p id="total">Total: $0</p>
<p class="presupuesto">Presupuesto mensual: $500.000</p>
  </main>
</body>
</html>
